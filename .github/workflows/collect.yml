name: collect-schedule

# 30분마다 편성표를 수집해 GitHub Pages 에 schedule.json 으로 게시한다.
# 앱은 https://<github-id>.github.io/<repo>/schedule.json 을 읽는다.
on:
  schedule:
    - cron: "7,37 * * * *"     # 매시 7분·37분 (정각 혼잡 회피)
  workflow_dispatch: {}
  push:
    paths: ["collector/**", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Parser tests
        run: python -m unittest discover -s collector/tests -t .
      - name: Collect
        run: python -m collector.main --out public/schedule.json --days 2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
